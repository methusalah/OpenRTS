// Web-app module: compiles OpenRTS to JavaScript via TeaVM using webmonkeyengine
// as the JME3 WebGL2 backend. Physics (Minie) is stubbed out for the web build.

plugins {
    id 'java'
    id 'org.teavm' version '0.14.0'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://teavm.org/maven/repository/' }
    maven { url 'https://repo.repsy.io/mvn/riccardobl/jme3-teavm' }
}

// Inherit version properties from root project
def jmonkeyengine_version = rootProject.ext.jmonkeyengine_version
def guava_version = rootProject.ext.guava_version
def jackson_version = rootProject.ext.jackson_version
def slf4j_version = rootProject.ext.slf4j_version

dependencies {
    // webmonkeyengine — JME3 3.7.x fork with WebGL2/TeaVM backend
    // Uses JitPack to build from source since no Maven Central release exists.
    // These replace the standard jme3-* desktop artifacts.
    implementation 'com.github.riccardobl.webmonkeyengine:jme3-core:master-SNAPSHOT'
    implementation 'com.github.riccardobl.webmonkeyengine:jme3-effects:master-SNAPSHOT'
    implementation 'com.github.riccardobl.webmonkeyengine:jme3-terrain:master-SNAPSHOT'
    implementation 'com.github.riccardobl.webmonkeyengine:jme3-plugins:master-SNAPSHOT'
    implementation 'com.github.riccardobl.webmonkeyengine:jme3-jogg:master-SNAPSHOT'
    implementation 'com.github.riccardobl.webmonkeyengine:jme3-web:master-SNAPSHOT'

    // TeaVM classlib (Java standard library emulation for the browser)
    implementation 'org.teavm:teavm-classlib:0.14.0'
    implementation 'org.teavm:teavm-jso-apis:0.14.0'

    // Pure-Java utilities (TeaVM-compatible)
    implementation "com.google.guava:guava:$guava_version"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jackson_version"
    implementation "org.slf4j:slf4j-api:$slf4j_version"
}

// Compile to Java 8 bytecode — TeaVM works best with Java 8 class files.
// The game logic was already written at Java 8 level for the web build.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java {
            // Web-specific source only: entry point, simplified base app, Minie stubs.
            // Core game source is added via tasks.named('compileJava') below so that
            // the exclude patterns target only ../core/src and do NOT accidentally
            // suppress matching-path web overrides in this 'src' directory.
            srcDir 'src'
        }
        resources {
            // Include the game's assets
            srcDirs = ['../core/assets']
        }
    }
}

// Add core game source with web-incompatible files excluded.
// Doing this at the task level (not in sourceSets) avoids global exclude patterns
// removing the same-named web overrides from 'src/' (e.g. OpenRTSApplication.java).
tasks.named('compileJava').configure {
    source fileTree('../core/src').matching {
        exclude 'app/MainRTS.java'
        exclude 'app/OpenRTSApplication.java'   // replaced by web-app/src version
        exclude 'app/example/**'
        exclude 'network/**'                    // jme3-networking unavailable on web
    }
}

// Only mainClass is required here; output directory is handled by the CI copy step
// (TeaVM 0.14.0 writes to build/generated/teavm/js/ by default).
teavm {
    js {
        mainClass = 'app.WebMainRTS'
    }
}
