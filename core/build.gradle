plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    id 'com.gradleup.shadow'
}

application {
    mainClass = 'app.MainRTS'
}

// No additional dependencies needed here - they're inherited from the root project

sourceSets {
    main {
        java { srcDirs = ['src'] }
        resources { srcDirs = ['assets'] }
    }
    test {
        java { srcDirs = ['test/java'] }
        resources { srcDirs = ['test/resources'] }
    }
}

tasks.withType(JavaExec) {
    // JVM arguments for running the application
    jvmArgs = [
        '-Xms512m',
        '-Xmx2g',
        '-XX:+UseG1GC'
    ]
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += '-XstartOnFirstThread'
    }
}

// CheerpJ 3.x requires Java 11 class file format (format version 55).
// Override the allprojects release=21 for this module so shadowJar produces
// bytecode that CheerpJ can load. The Java 21 JVM still runs the desktop
// build without issue — Java is backwards-compatible.
tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

shadowJar {
    archiveBaseName.set('openrts-web')
    archiveVersion.set('')
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': 'app.MainRTS'
    }
    mergeServiceFiles()

    // Strip all platform-native binaries — CheerpJ provides its own WASM runtime
    // and does not use these JNI shared libraries.
    exclude 'native/**'          // Minie/Bullet per-platform .dylib/.dll/.so
    exclude 'lib/**'             // Minie Android .so files
    exclude 'windows/**'         // LWJGL3 Windows natives
    exclude 'linux/**'           // LWJGL3 Linux natives
    exclude 'macos/**'           // LWJGL3 macOS natives
    exclude '**/*.dll'
    exclude '**/*.dylib'
    exclude '**/*.jnilib'
    exclude 'native/osx/**'
    exclude 'native/linux/**'
    exclude 'native/windows/**'

    // Strip Java 17 and Java 21 multi-release JAR entries from LWJGL, Jackson,
    // and Logback. These libraries ship optimised class files in META-INF/versions/
    // for newer runtimes. CheerpJ (version:21) selects them but cannot load Java 17+
    // bytecode (major versions 61/65). Removing them forces CheerpJ to fall back to
    // the Java 8/11 base classes, which our bytecode target already matches.
    exclude 'META-INF/versions/17/**'
    exclude 'META-INF/versions/21/**'
}

eclipse {
    project {
        name = "${appName}-core"
    }

    classpath {
        downloadSources = true
        downloadJavadoc = true
    }
}
