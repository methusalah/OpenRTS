name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compile game to JavaScript via TeaVM
        run: ./gradlew :web-app:generateJavaScript --no-daemon

      - name: Collect TeaVM JS output into web/js
        run: |
          mkdir -p web/js
          # TeaVM 0.14 writes to build/generated/teavm/js/ (or similar).
          # We locate classes.js regardless of the exact sub-path.
          JS=$(find web-app/build -name "classes.js" | head -1)
          if [ -z "$JS" ]; then
            echo "ERROR: classes.js not found under web-app/build/" && exit 1
          fi
          echo "Copying $JS → web/js/classes.js"
          cp "$JS" web/js/classes.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
