<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>OpenRTS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #00e5ff;
      font-family: monospace;
      font-size: 1.1rem;
      gap: 1.2rem;
      z-index: 100;
      transition: opacity 0.6s;
    }
    #loading h1 { font-size: 2rem; letter-spacing: 0.15em; color: #fff; }
    #progress-bar { width: 280px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
    #progress-fill { height: 100%; width: 0%; background: #00e5ff; border-radius: 3px; transition: width 0.4s ease; }
    #status-msg { font-size: 0.85rem; color: #888; }
    #touch-hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: #ccc;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="loading">
    <h1>OpenRTS</h1>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="status-msg">Loading…</div>
  </div>

  <div id="touch-hint">
    Tap: select &nbsp;|&nbsp; 2-finger tap: move &nbsp;|&nbsp; Drag: pan &nbsp;|&nbsp; Pinch: zoom
  </div>

  <script src="touch.js"></script>
  <script>
    const fill    = document.getElementById('progress-fill');
    const msg     = document.getElementById('status-msg');
    const loading = document.getElementById('loading');
    const hint    = document.getElementById('touch-hint');

    function setProgress(pct, text) {
      fill.style.width = pct + '%';
      if (text) msg.textContent = text;
    }

    function hideLoading() {
      loading.style.opacity = '0';
      setTimeout(() => loading.remove(), 650);
      if ('ontouchstart' in window) {
        hint.style.opacity = '1';
        setTimeout(() => { hint.style.opacity = '0'; }, 6000);
      }
    }

    setProgress(10, 'Loading game script…');

    // TeaVM-compiled game JS
    var script = document.createElement('script');
    script.src = 'js/classes.js';
    script.onload = function() {
      setProgress(60, 'Initialising…');
      // TeaVM's main() is invoked via the generated bootstrap
      if (typeof main === 'function') {
        try {
          main();
          setProgress(100, 'Running');
          setTimeout(hideLoading, 600);
        } catch (e) {
          msg.textContent = 'Error: ' + e.message;
          fill.style.background = '#f44';
          console.error(e);
        }
      } else {
        setProgress(100, 'Running');
        setTimeout(hideLoading, 600);
      }
    };
    script.onerror = function() {
      msg.textContent = 'Failed to load game script';
      fill.style.background = '#f44';
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
