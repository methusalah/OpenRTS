<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>OpenRTS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    /* JME3 uses LWJGL/GLFW to create its own canvas. CheerpJ appends it to
       <body>. We stretch any canvas that CheerpJ injects to fill the viewport. */
    body > canvas,
    body > div > canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #00e5ff;
      font-family: monospace;
      font-size: 1.1rem;
      gap: 1.2rem;
      z-index: 100;
      transition: opacity 0.6s;
    }
    #loading h1 { font-size: 2rem; letter-spacing: 0.15em; color: #fff; }
    #progress-bar {
      width: 280px;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #00e5ff;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    #status-msg { font-size: 0.85rem; color: #888; }

    #touch-hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: #ccc;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="loading">
    <h1>OpenRTS</h1>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="status-msg">Loading runtime…</div>
  </div>

  <div id="touch-hint">
    Tap: select &nbsp;|&nbsp; 2-finger tap: move &nbsp;|&nbsp; Drag: pan &nbsp;|&nbsp; Pinch: zoom
  </div>

  <!--
    CheerpJ Community Edition — free for open-source projects.
    See https://cheerpj.com/docs/getting-started/ for licensing.
  -->
  <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
  <script src="touch.js"></script>
  <script>
    const progressFill = document.getElementById('progress-fill');
    const statusMsg    = document.getElementById('status-msg');
    const loadingDiv   = document.getElementById('loading');
    const touchHint    = document.getElementById('touch-hint');

    function setProgress(pct, msg) {
      progressFill.style.width = pct + '%';
      if (msg) statusMsg.textContent = msg;
    }

    function hideLoading() {
      if (!loadingDiv.parentNode) return;
      loadingDiv.style.opacity = '0';
      setTimeout(() => loadingDiv.remove(), 650);
      if ('ontouchstart' in window) {
        touchHint.style.opacity = '1';
        setTimeout(() => { touchHint.style.opacity = '0'; }, 6000);
      }
    }

    async function launch() {
      setProgress(5, 'Initialising runtime…');

      await cheerpjInit({
        // Omitting version uses the stable Java 8 default.
        // version:21 → "unsupported Java version 21" (not supported by CheerpJ 3.0)
        // version:11 → cj3n11.wasm path-resolution bug on external hosts
        jnilibURL: 'https://cjrtnc.leaningtech.com/native/',
      });

      setProgress(40, 'Loading game…');

      // JME3 uses LWJGL3/GLFW to create its own window — NOT an AWT/Swing surface.
      // cheerpjCreateDisplay() is for Swing apps and would conflict here.
      // CheerpJ appends the GLFW canvas directly to <body>.
      // We watch document.body for any new canvas or div that CheerpJ adds.
      let hidden = false;
      function onGameVisible() {
        if (hidden) return;
        hidden = true;
        setProgress(100, 'Running');
        setTimeout(hideLoading, 600);
      }

      // Watch body for the GLFW/OpenGL canvas CheerpJ injects.
      const observer = new MutationObserver(() => onGameVisible());
      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback: hide loading after 30 s even if the canvas never appears,
      // so the user can at least see if something is rendered underneath.
      const fallback = setTimeout(() => {
        console.warn('OpenRTS: 30 s timeout — hiding loading screen. Check console for errors.');
        onGameVisible();
      }, 30000);

      setProgress(60, 'Starting OpenRTS…');

      // cheerpjRunJar blocks until the JVM exits.
      await cheerpjRunJar('/app/openrts-web.jar');

      clearTimeout(fallback);
      observer.disconnect();
    }

    launch().catch(err => {
      console.error('Launch error:', err);
      statusMsg.textContent = 'Error: ' + (err.message || err);
      progressFill.style.background = '#f44';
    });
  </script>
</body>
</html>
