pluginManagement {
    repositories {
        // TeaVM Gradle plugin lives in its own Maven repository
        maven { url 'https://teavm.org/maven/repository/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'OpenRTS'

include 'core'
include 'example'
include 'web-app'
